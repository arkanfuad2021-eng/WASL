name: Build WASL APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASL-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-debug
          name: WASL v1.0.0 Debug APK
          body: |
            ## WASL (وَصْل) – Secure SMS Messaging Application
            النسخة التجريبية الأولى لتطبيق WASL للمراسلة المشفرة عبر SMS بدون إنترنت.
            - تشفير كامل طرفاً لطرف (X25519, Ed25519, AES-256-GCM).
            - دعم تعدد شرائح SIM وتجزئة الرسائل الطويلة.
            - بدون إنترنت نهائياً (Air-gapped).
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
