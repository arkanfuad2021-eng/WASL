name: Build WASL APK

on:
  push:
    branches: [ main, master, ci/release-verify ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK Platform 34 & Build Tools 34.0.0
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null)
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK (R8 & ProGuard)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Align, Sign with Fixed Keystore & Verify Release APK
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TEST_KEYSTORE_BASE64"
          test -n "$TEST_KEYSTORE_PASSWORD"
          test -n "$TEST_KEY_ALIAS"
          test -n "$TEST_KEY_PASSWORD"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/34.0.0"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"

          TEST_KEYSTORE="$RUNNER_TEMP/wasl-signing.p12"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/WASL-v1.0.0-release-signed.apk"

          cleanup() {
            rm -f "$TEST_KEYSTORE" "$ALIGNED_APK"
          }
          trap cleanup EXIT

          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 -d > "$TEST_KEYSTORE"
          chmod 600 "$TEST_KEYSTORE"

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$TEST_KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$TEST_KEY_ALIAS" \
            --ks-pass env:TEST_KEYSTORE_PASSWORD \
            --key-pass env:TEST_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$SIGNED_APK"

      - name: Upload Release Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASL-Release-Signed-APK
          path: ${{ runner.temp }}/WASL-v1.0.0-release-signed.apk
          if-no-files-found: error

      - name: Upload R8 Mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASL-R8-Mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WASL-Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
